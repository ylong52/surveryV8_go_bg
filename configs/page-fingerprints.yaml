# configs/page-fingerprints.yaml
# 站点配置（sites / site_page_fingerprints）已迁移至数据库，此处仅保留全局默认配置。

# ═════════════════════════════════════════════════════════════════════════════
# URL 清洗规则（参考文档）
# ═════════════════════════════════════════════════════════════════════════════
#
# 【URL 匹配流程】
#   原始 URL → 清洗（移除尾部非合法URL字符）→ 与 sites.url 匹配
#
# 【清洗规则】
#   正则：(https?://[^/]+[/a-zA-Z0-9_.-]*)[^a-zA-Z0-9_/.-]*$
#   含义：
#     - 捕获组1：协议(https://) + 域名 + 路径（允许字母/数字/斜杠/点/横线/下划线）
#     - 移除尾部所有非合法URL字符（[^a-zA-Z0-9_/.-]*）
#
# 【清洗示例】
#   https://xxx/260216#?         → https://xxx/260216
#   https://xxx/260216#?abc123   → https://xxx/260216
#   https://xxx/260216##         → https://xxx/260216
#   https://xxx/260216?a=1       → https://xxx/260216
#   https://xxx/260216^          → https://xxx/260216
#
# 【注意】
#   含字母/数字的查询参数（如 ?link=1&wspid=0133-2SV_xxx）不会被截断，
#   数据库中该类站点的 url 字段需保留完整查询参数以确保精确匹配。
#
# ═════════════════════════════════════════════════════════════════════════════

# ═════════════════════════════════════════════════════════════════════════════
# 正则编写规范（数据库 page_id_pattern_regex 字段参考）
# ═════════════════════════════════════════════════════════════════════════════
#
# 【HTML 清洗流程】
#   原始 HTML → fixEncoding() → StripForDirectSurvey() → 用于正则匹配
#
# 【StripForDirectSurvey 会移除以下内容】
#   - <style>、<svg>、HTML注释
#   - class 属性（不在白名单中）
#   - style 属性
#   - aria-* 属性
#   - 未列出的 data-* 属性
#
# 【属性白名单（会被保留）】
#   name, value, id, type, checked, selected, for, headers, role,
#   data-name, data-value, data-id, data-index, data-qid
#
# 【常见问题】
#   1. ❌ 不要依赖 class 属性匹配，如 class="QuestionText"
#      因为 class 会被清洗掉
#   2. ❌ 不要使用贪婪匹配 .*，会导致匹配到多个标签
#   3. ✅ 使用非贪婪匹配 .*? 或 [\s\S]*?
#   4. ✅ 优先匹配外层标签（如 <legend><div>...）而非属性
#   5. ✅ 如果 HTML 中有换行符，必须使用 [\s\S]*? 而不是 .*?
#   6. ✅ 如果 legend 与子标签之间有空格，使用 \s* 匹配
#
# 【正则格式（存入数据库的 JSON 数组）】
#   - 使用 JavaScript 风格：/pattern/flags
#   - flags 只支持：gi（全局+忽略大小写）
#   - Go 代码会自动去掉 / 和 flags 进行编译
#   - JSON 存储时 \ 需要双写：[\s\S] → [\\s\\S]，\" 需转义
#
# ═════════════════════════════════════════════════════════════════════════════


# ─────────────────────────────────────────────────────────
# 默认配置（全局，不随站点变化）
# ─────────────────────────────────────────────────────────
defaults:
  cache:
    enabled: true
    base_path: "storage/cache/{survey_id}/"
    ttl_days: 30
    save_screenshots: true
    save_html: true
    save_question_type_data: true

  logs:
    enabled: true
    root_path: "storage/logs/{survey_id}"

    page_events:
      enabled: true
      subdir: "storage/page_events/{survey_id}"
      filename_template: "page_events_{timestamp}.jsonl"
      max_size_mb: 100
      max_days: 30
      events:
        - fingerprint_extraction
        - ai_analysis
        - next_button_hook
        - cache_skip
        - page_skip

    analysis:
      enabled: true
      subdir: "storage/analysis/{survey_id}"
      filename_template: "analysis_{timestamp}.jsonl"
      max_size_mb: 100
      max_days: 30
      save:
        subject: true
        qtype: true
        yaml: true
        prompt: true
        answers: true

  filename_format:
    max_length: 100
    keep_chars: 'a-zA-Z0-9_'
    collapse_underscores: true
    trim_underscores: true
    lowercase: true
