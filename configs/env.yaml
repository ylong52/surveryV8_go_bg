# ── Proxy ────────────────────────────────────────────────────────────────────
proxy:
  # 国内域名不走代理，直连
  no_proxy: "ark.cn-beijing.volces.com,ark.cn-shanghai.volces.com,models.mixedcloud.cn,api.deepseek.com"
  # Node.js fetch 全局代理（仅国外域名需要）
  https_proxy: "http://127.0.0.1:7890"
  http_proxy:  "http://127.0.0.1:7890"

# ── DeepSeek API ──────────────────────────────────────────────────────────────
deepseek:
  api_key:          "sk-59d68b4bdf3b44d995c962b1b192f792"
  base_url:         "https://api.deepseek.com"
  model:            "deepseek-chat"
  temperature:      0.1
  max_input_tokens: 90000
  timeout:          120
  # 专用代理转发地址，留空则直连
  proxy_url:        ""

# ── Aliyun Qwen Vision（替换原火山引擎配置）──────────────────────────────────
volces_vision:
  api_key:     "sk-7fb1444ef4d64a3bb38ba71aa2c26860"
  base_url:    "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model:       "qwen3-vl-flash"
  temperature: 0.7
  timeout:     120
  # 阿里云国内模型通常不需要代理，按需保留
  proxy_url:   ""


# Gemini API Settings (MixedCloud)
gemini:
  api_key:     "sk-iBfT7JM3xkKcZ2vjO1LIb8yJks5z3A6ycWiPLL1KYtLrK9a3"
  base_url:    "https://models.mixedcloud.cn/v1"
  model:       "gemini-3-flash-preview"
  temperature: 0.1
  timeout:     60


# ── Anthropic Claude API（用于开放题验证）────────────────────────────────────
anthropic:
  api_key:     "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"  
  base_url:    "https://api.anthropic.com"
  model:       "claude-sonnet-4-6"          # 或 claude-3-5-sonnet
  max_tokens:  1024
  temperature: 0.0
  timeout:     60

# ── AI Model Selection ────────────────────────────────────────────────────────
# active_models 候选值: deepseek / gemini / kimi / volces（逗号分隔，按优先级排序）
# 示例: "volces,kimi,deepseek" → 优先 VOLCES，备选 Kimi，再备选 DeepSeek
ai:
  active_models:       "deepseek"
  active_vision_model: "volces_vision"

# ── WebSocket Server ──────────────────────────────────────────────────────────
websocket:
  port:       5001
  timeout_ms: 600000

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  dir:         "./logs"
  max_size_mb: 50
  enabled:     true
