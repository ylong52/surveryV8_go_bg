<!DOCTYPE html>
<html lang="en">
<head><title>Age Survey</title></head>
<body>
<form id="survey-form">
  <div class="question">
    <label class="question-text">What is your age range?</label>
    <div class="options">
      <input type="radio" name="age" value="1"><label>Under 18</label>
      <input type="radio" name="age" value="2"><label>18-34</label>
      <input type="radio" name="age" value="3"><label>35-54</label>
      <input type="radio" name="age" value="4"><label>55 or older</label>
    </div>
  </div>
  <input type="submit" value="Next">
</form>
</body>
</html>
