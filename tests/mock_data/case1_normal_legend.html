<!DOCTYPE html>
<html lang="en">
<head><title>Vehicle Survey</title></head>
<body>
<form id="survey-form">
  <legend>What is the make and model of your vehicle?</legend>
  <div class="options">
    <input type="radio" name="q1" id="opt1" value="1">
    <label for="opt1">Toyota Camry</label>
    <input type="radio" name="q1" id="opt2" value="2">
    <label for="opt2">Honda Accord</label>
    <input type="radio" name="q1" id="opt3" value="3">
    <label for="opt3">Ford F-150</label>
  </div>
  <input type="submit" value="Next">
</form>
</body>
</html>
